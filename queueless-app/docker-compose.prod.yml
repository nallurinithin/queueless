# -----------------------------------------------------------------------------
# QueueLess Production Docker Compose Specification
# Self-contained stack: MongoDB + Express API Server + Nginx SPA Frontend
# -----------------------------------------------------------------------------
services:
  mongodb:
    image: mongo:8.0-noble
    container_name: queueless_prod_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: queueless_prod
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - queueless_internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: queueless_prod_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/queueless_prod
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,https://aarogyam.clinic
      SESSION_SECRET: ${SESSION_SECRET:-change_in_production_session_secret_key_32bytes}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_aarogyam}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-test_secret_key_aarogyam_123}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-test_webhook_secret_aarogyam_456}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - queueless_internal
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: queueless_prod_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - queueless_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  queueless_internal:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
